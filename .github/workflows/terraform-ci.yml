name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.16.3"
  TF_WORKING_DIR: "environments/dev"

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          skip_check: CKV_AZURE_237,CKV_AZURE_233,CKV_AZURE_167,CKV_AZURE_164,CKV_AZURE_165,CKV_AZURE_166,CKV_AZURE_163,CKV_AZURE_139,CKV_AZURE_170,CKV_AZURE_172,CKV_AZURE_141,CKV_AZURE_115,CKV_AZURE_117,CKV_AZURE_7,CKV_AZURE_226,CKV_AZURE_116,CKV_AZURE_6,CKV_AZURE_171,CKV_AZURE_168,CKV_AZURE_4,CKV_AZURE_227,CKV2_AZURE_29

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -var-file="dev.tfvars.example"
